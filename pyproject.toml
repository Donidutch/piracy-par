[project]
name = "piracy-par"
version = "0.1.0"
description = "Poisson autoregressions (PAR/INGARCH, PARX, log-linear PARX) for weekly maritime piracy counts, with an IMB incident scraper."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Nicklas" }]
license = "MIT"
keywords = ["count time series", "poisson autoregression", "INGARCH", "forecasting", "piracy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
scrape = ["selenium>=4.15"]

[project.scripts]
piracy-par-scrape = "piracy_par.data.imb_scraper:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piracy_par"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
